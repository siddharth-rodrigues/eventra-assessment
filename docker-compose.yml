services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DATABASE__DB:-eventra}
      POSTGRES_USER: ${DATABASE__USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:-postgres}
    ports:
      - "${DATABASE__PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE__USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"

volumes:
  postgres_data:
